name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libncurses5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Generate buildozer.spec Safely
        run: |
          python3 -c "
          spec_content = '''[app]
          title = SMS Forwarder
          package.name = smsforwarder
          package.domain = org.hamza
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          requirements = python3,kivy==2.3.0,openssl
          orientation = portrait
          fullscreen = 0
          android.permissions = READ_SMS,RECEIVE_SMS,READ_CALL_LOG,READ_PHONE_STATE,INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          '''
          with open('buildozer.spec', 'w', encoding='utf-8') as f:
              f.write(spec_content.strip())
          "

      - name: Auto-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android p4a -- get-licenses || true

      - name: Build APK
        run: |
          # إضافة أمر صريح لضمان استمرار البناء دون توقف مؤقت
          buildozer -v android debug
        timeout-minutes: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Forwarder-APK
          path: bin/*.apk
          if-no-files-found: warn
