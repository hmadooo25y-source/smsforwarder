name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git zlib1g-dev libffi-dev
          pip install buildozer cython

      - name: Build APK
        run: |
          cat > buildozer.spec << 'SPEC'
          [app]
          title = SMS Forwarder
          package.name = smsforwarder
          package.domain = org.hamza
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          requirements = python3,kivy==2.3.0,openssl
          orientation = portrait
          fullscreen = 0
          android.permissions = READ_SMS,RECEIVE_SMS,READ_CALL_LOG,READ_PHONE_STATE,INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Forwarder-APK
          path: bin/*.apk
